openapi: 3.0.3
info:
  title: PSI swagger 15-09-2026
  version: v0.9.1
  description: >
    ### L'API Pro Santé Identité (PSI) permet de :
      - **Inscrire** un personnel en santé dans Pro Santé Identité
      - **Obtenir** le ou les identifiants RPPS associés à une identité
      - **Transmettre** au RPPS la création ou l’arrêt d’une activité d’un PS
      - **Commander** une carte CPx

  contact:
    name: "Pro Santé Identité"
    url: "https://psi.esante.gouv.fr"
servers:
  - url: https://psi-partenaire.gateway.api.esante.gouv.fr
    description: Gravitee
