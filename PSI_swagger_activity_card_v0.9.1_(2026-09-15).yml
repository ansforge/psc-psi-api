      type: boolean
      description: Indique si la personne possède la nationalité française.
      example: true
      default: true

    CardOrderPsiRequestDto:
      type: object
      description: "Bloc de commande de carte PSI.\n\
        \nIl peut y avoir qu'un type de commande à la fois.\
        \nLorsque ce bloc est présent dans la requête,  l'adresse doit être renseignée et\
        \  valide pour réaliser la commande.\n- Pour une adresse à l'étranger (pays renseigné et différent\
        \ de \"FRANCE\"), au minimum les champs addressee, streetName, city, postalCode et country doivent\
        \ être fournis.\n- Pour une adresse en France (pays non renseigné ou égal\
        \ à \"FRANCE\"), la validité de l'adresse est contrôlée via l'API de géocodage\
        \ IGN/BAN (https://data.geopf.fr/geocodage/search/?q=[numero]+[nom de la voie]+[code\
        \ postal]+[ville])."
      properties:
        addressee:
          type: string
          description: Destinataire (obligatoire en cas de commande de carte à l'étranger)
          example: DR DUPONT Jean
        streetNumber:
          type: string
          description: Numéro dans la voie
          example: '10'
        streetName:
          type: string
          description: Nom de la voie (obligatoire en cas de commande de carte à l'étranger)
          example: RUE DE LA PAIX
        additionalAddress:
          type: string
          description: Complément d'adresse
          example: Bâtiment B
        postalCode:
          type: string
          description: Code postal
          example: '75002'
        city:
          type: string
          description: Ville (obligatoire en cas de commande de carte à l'étranger)
          example: PARIS
        country:
          type: string
          description: Pays (libellé) (obligatoire en cas de commande de carte à l'étranger)
          example: FRANCE

    CardOrderCpsRequestDto:
      type: object
      description: "Bloc de commande de carte CPS.\n\
        \nLorsque ce bloc est présent dans la requête, le \"code profession\" et \
        \  la \"catégorie professionnelle\" doivent être renseignés et valides\" \
        \  pour réaliser la commande."
      properties:
        professionCode:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^\d{2}$'
          description: "Obligatoire si l'identifiant RPPS est renseigné : Sa valeur fait référence à la profession du professionel de santé et doit appartenir à une liste de valeurs autorisées. 10 pour un médecin, 21 pour un pharmacien, 26 pour un audioprothésiste... (voir TRE G15-ProfessionelSante)"
          example: '10'

        professionalCategoryCode:
          type: string
          enum: [ "C", "E", "M" ]
          description: |
            - "C" : Civil
            - "E" : Etudiant
            - "M" : Agent de l'état

      required:
        - professionCode
        - professionalCategoryCode

    ActivityRequestDto:
      type: object
      description: "Bloc lié à la création ou à la modification d'une activité"
      properties:
        professionCode:
          allOf:
            - $ref: "#/components/schemas/professionCode"
        professionalCategoryCode:
          allOf:
            - $ref: "#/components/schemas/professionalCategoryCode"
        activityStartDate:
          allOf:
            - $ref: "#/components/schemas/activityStartDate"
        activityEndDate:
          allOf:
            - $ref: "#/components/schemas/activityEndDate"
        function:
          allOf:
            - $ref: "#/components/schemas/function"
        activityGenre:
          allOf:
            - $ref: "#/components/schemas/activityGenre"
        practiceMode:
          allOf:
            - $ref: "#/components/schemas/practiceMode"
        liberalActivityTypeCode:
          allOf:
            - $ref: "#/components/schemas/liberalActivityTypeCode"
        activityEndReason:
          allOf:
            - $ref: "#/components/schemas/activityEndReason"
        issuingEstablishment:
          allOf:
            - $ref: "#/components/schemas/issuingEstablishment"
          description: Identifiant FINESS ou SIRET de l'etablissement emetteur de l'appel (doit correspondre a l'identifiant structure utilise dans l'appel)
        numFINESSET:
          allOf:
            - $ref: "#/components/schemas/numFINESSET"
          description: Numéro FINESS de l'établissement géographique. Si défini, les paramètres rppsRank et numSIRET ne doivent pas être renseignés
        numSIRET:
          allOf:
            - $ref: "#/components/schemas/numSIRET"
          description: Numéro SIRET de l'établissement géographique. Si défini, les paramètres numFINESSET et rppsRank ne doivent pas être renseignés
        rppsRank:
          allOf:
            - $ref: "#/components/schemas/rppsRank"
          description: Numéro RPPS RANG de l'établissement géographique. Si défini, les paramètres numFINESSET et numSIRET ne doivent pas être renseignés
      required:
        - professionCode
        - professionalCategoryCode
        - activityStartDate
        - function
        - activityGenre
        - practiceMode
        - issuingEstablishment

    EmploymentRequestDto:
      type: object
      description: "Bloc lié à la création ou à la modification d'un emploi"
      properties:
        function:
          allOf:
            - $ref: "#/components/schemas/employmentFunction"
        issuingEstablishment:
          allOf:
            - $ref: "#/components/schemas/issuingEstablishment"
          description: Identifiant FINESS ou SIRET de l'etablissement emetteur de l'appel (doit correspondre a l'identifiant structure utilise dans l'appel)
        employmentStartDate:
          allOf:
            - $ref: "#/components/schemas/employmentStartDate"
        employmentEndDate:
          allOf:
            - $ref: "#/components/schemas/employmentEndDate"
      required:
        - function
        - issuingEstablishment

    activityEndReason:
      type: string
      description: |
        Voir la NOS de l'ANS pour avoir le jeu complet de valeurs possibles 
        - "AUT" : Autre motif
        - "CHA" : Changement d'activité
        - "CHL" : Changement de lieu d'exercice
        - "CHP" : Changement de profession
        - "DCD" : Décès
        - "ETR" : Départ à l'étranger
        - "RH" : Retraite hospitalière
        - "RL" : Retraite libérale
        - "RS" : Retraite salariée
      example: "AUT"

    issuingEstablishment:
      type: string
      minLength: 2
      maxLength: 30
      description: La valeur du paramètre issuingEstablishment doit être sur 9 ou 14 chiffres, dépendant de l'identifiant structure utilisé

    rppsRank:
      type: string
      pattern: '^1\d{13}$'
      description: Le RPPS RANG d'un établissement doit commencer par un 1 et comporter 14 chiffres

    numSIRET:
      type: string
      pattern: '^\d{14}$'
      description: Le numéro SIRET d'un établissement doit comporter 14 chiffres

    numFINESSET:
      type: string
      pattern: '^\d{9}$'
      description: Le numéro FINESS d'un établissement doit comporter 9 chiffres

    practiceMode:
      type: string
      description: |
        Mode d'exercice du PROL, Veuillez vous référer à la MOS - JDV_J117-ModeExercice-ENREG
         - "L" : Libéral
         - "S" : Salarié
         - "B" : Bénévole

    professionalCategoryCode:
      type: string
      enum: [ "C", "E", "M" ]
      description: |
        - "C" : Civil
        - "E" : Etudiant
        - "M" : Agent de l'état

    activityStartDate:
      type: string
      pattern: "^\\d{4}(-\\d{2})(-\\d{2})$"
      description: Date de début d'activité sous le forme [AAAA]-[MM]-[JJ]

    activityEndDate:
      type: string
      pattern: "^\\d{4}(-\\d{2})(-\\d{2})$"
      description: Date de fin  d'activité sous le forme [AAAA]-[MM]-[JJ] devant être supérieure ou égale à la date de début

    professionCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '^\d{2}$'
      description: Identifiant du code de la profession du PROL sur 2 chiffres. Veuillez vous référer à la MOS - JDV_J106-EnsembleProfession-RASS

    function:
      type: string
      pattern: '^(\d{3}|FON-\d{2})$'
      description: code Fonction sur 3 chiffres pour un acteur à rôle ou FON-xx avec xx 2 digits. Veuillez vous référer à la MOS - JDV_J121-RolePriseCharge-ENREG

    employmentStartDate:
      type: string
      pattern: "^\\d{4}(-\\d{2})(-\\d{2})$"
      description: Date de début d'emploi sous le forme [AAAA]-[MM]-[JJ]

    employmentEndDate:
      type: string
      pattern: "^\\d{4}(-\\d{2})(-\\d{2})$"
      description: Date de fin d'emploi sous le forme [AAAA]-[MM]-[JJ] devant être supérieure ou égale à la date de début

    employmentFunction:
      type: string
      description: Nom du poste
      enum:
        - Responsable légal ou personne habilitée à engager la structure
        - Mandataire
        - Gestionnaire d'identité numérique
        - Professionnel Achat-Logistique
        - Professionnel Gestion de l'information
        - Professionnel Ingénierie et maintenance technique
        - Professionnel Management, gestion et aide à la décision
        - Professionnel Qualité, hygiène, sécurité et environnement
        - Professionnel Recherche clinique
        - Professionnel Social, éducatif, psychologique et culturel
        - Professionnel Soin
        - Professionnel Systèmes d'information
        - Autorité de certification d'identité EDC PSC

    liberalActivityTypeCode:
      type: string
      pattern: '^ACT-LIB-\d{2}$'
      description: |
        Code typeActiviteLiberal du PROL. Veuillez vous référer à la MOS - JDV_J119-TypeActiviteLiberale-ENREG
        - "ACT-LIB-01" : Cabinet primaire
        - "ACT-LIB-02" : Cabinet secondaire
        - "ACT-LIB-03" : Plateau technique
        - "ACT-LIB-04" : Secteur privé à l'hôpital
        - "ACT-LIB-05" : Autre lieu d'exercice ou autre site
        - "ACT-LIB-06" : Cabinet

    activityGenre:
      type: string
      pattern: '^GENR\d{2}$'
      description: |
        Voir la NOS de l'ANS pour avoir le jeu complet de valeurs possibles (MOS - JDV_J116-GenreActivite-ENREG)
        - "GENR01" : Activité de soin et de pharmacie
        - "GENR08" : Coordination et orientation
        - "GENR09" : Administratif ou appui à l organisation de l'accompagnement social/médico-social
        - "GENR10" : Accompagnement social/médico-social à la vie sociale, professionnelle, éducative
        - "GENR11" : Accompagnement social/médico-social au soin
        - "GENR12" : Encadrement et organisation de l'accompagnement
        - "GENR13" : Médico-administratif
        - "GENR99" : Autre activité

    Status:
      type: integer
      description: Code de statut HTTP
      example: 200

    CardCode:
      type: string
      description: Code de la commande de carte
      example: E04_U010_CARD_ORDER_SUCCESSFUL
      enum:
        - E04_U010_CARD_ORDER_ADDRESS_REFUSED
        - E04_U010_CARD_ORDER_SUCCESSFUL
        - E04_U010_CARD_ORDER_FAILED_DEPENDENCY
        - E04_U010_CARD_ORDER_REFUSED
        - E04_U010_CARD_ORDER_REFUSED_CPS
        - E04_U010_CARD_ORDER_SERVICE_UNAVAILABLE

    CardOrderAddressMessage:
      type: string
      description: Résultat de la validation de l'adresse de livraison
      example: La commande de carte a été refusée car l'adresse fournie n'est pas utilisable (vous pouvez la vérifier sur https://adresse.data.gouv.fr/)

    CardOrderPsiResponseDto:
      type: object
      description: "Bloc de commande de carte PSI."
      properties:
        status:
          $ref: '#/components/schemas/Status'
        code:
          $ref: '#/components/schemas/CardCode'
        message:
          $ref: '#/components/schemas/CardOrderAddressMessage'
        addressee:
          type: string
          description: Destinataire
          example: DR DUPONT Jean
          readOnly: true
        shippingAddress:
          type: string
          description: Adresse complète corrigée (si besoin) par l'API
          example: 10 RUE DE LA PAIX Bâtiment B 75002 PARIS
          readOnly: true

    CardOrderCpsResponseDto:
      type: object
      description: "Bloc de commande de carte CPS."
      properties:
        status:
          $ref: '#/components/schemas/Status'
        code:
          $ref: '#/components/schemas/CardCode'
        message:
          $ref: '#/components/schemas/CardOrderAddressMessage'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: ESANTE-API-KEY
      in: header
