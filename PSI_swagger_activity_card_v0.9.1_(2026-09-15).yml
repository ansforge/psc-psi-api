    ShortRnippData:
      type: object
      properties:
        metadonnees:
          type: object
          properties:
            dateIdentification:
              type: string
              format: date-time
            codeReponseIdentification:
              type: integer
              description: 'Code indiquant la réponse du système d’identification
                :

                - 9 : demande rejetée au contrôle en raison d’erreurs de syntaxe

                '
              enum:
                - 9
            divergences:
              type: object
              properties:
                nom:
                  type: boolean
                prenoms:
                  type: boolean
                sexe:
                  type: boolean
                dateNaissance:
                  type: boolean
                lieuNaissance:
                  type: boolean
            statutDuNomIdentifie:
              type: string
              description: 'Statut du nom identifié :

                - "O" : Officiel

                - "C" : Conjoint

                - "AO" : Ancien officiel

                - "AC" : Ancien conjoint

                '
              enum:
                - O
                - C
                - AO
                - AC
      example:
        metadonnees:
          dateIdentification: 2025-06-03 09:17:45+00:00
          codeReponseIdentification: 3
          divergences:
            nom: false
            prenoms: false
            sexe: false
            dateNaissance: false
            lieuNaissance: false
          statutDuNomIdentifie: null
    RnippData:
      type: object
      properties:
        metadonnees:
          type: object
          properties:
            dateIdentification:
              type: string
              format: date-time
            codeReponseIdentification:
              type: integer
              description: 'Code indiquant la réponse du système d’identification
                :

                - 2 : demande identifiée sans divergence d’état civil

                - 3 : demande identifiée avec divergence d’état civil ou NIR

                - 4 : demande non identifiée mais existence d’un seul écho

                - 6 : demande non identifiée mais existence de plus d’un écho

                - 7 : demande identifiée avec le nom d’usage uniquement

                - 8 : demande non identifiée sans écho

                - 9 : demande rejetée au contrôle en raison d’erreurs de syntaxe

                '
              enum:
                - 2
                - 3
                - 4
                - 6
                - 7
                - 8
                - 9
            divergences:
              type: object
              properties:
                nom:
                  type: boolean
                prenoms:
                  type: boolean
                sexe:
                  type: boolean
                dateNaissance:
                  type: boolean
                lieuNaissance:
                  type: boolean
            statutDuNomIdentifie:
              type: string
              description: 'Statut du nom identifié :

                - "O" : Officiel

                - "C" : Conjoint

                - "AO" : Ancien officiel

                - "AC" : Ancien conjoint

                '
              enum:
                - O
                - C
                - AO
                - AC
        individu:
          type: object
          properties:
            identites:
              type: array
              items:
                type: object
                properties:
                  statut:
                    type: string
                    description: 'Statut de l’identité :

                      - "O" : Officielle

                      - "C" : Du conjoint

                      '
                    enum:
                      - O
                      - C
                  nom:
                    type: string
                  prenoms:
                    type: array
                    items:
                      type: string
            sexe:
              $ref: '#/components/schemas/Sexe'
            naissance:
              $ref: '#/components/schemas/EvenementView'
            deces:
              $ref: '#/components/schemas/EvenementView'
      example:
        metadonnees:
          dateIdentification: 2025-06-03 09:17:45+00:00
          codeReponseIdentification: 3
          divergences:
            nom: false
            prenoms: false
            sexe: false
            dateNaissance: false
            lieuNaissance: true
          statutDuNomIdentifie: O
        individu:
          identites:
            - statut: O
              nom: DURAND
              prenoms:
                - Jeanne
                - Catherine
                - Marguerite
            - statut: C
              nom: DUPONT
          sexe: F
          naissance:
            date: 1980-07-15
            lieu:
              code: '57463'
              libelleCommune: Metz
              libellePays: France
            numeroActe: '1234'
          deces:
            date: 2025-06-15
            lieu:
              code: '76540'
              libelleCommune: Rouen
              libellePays: France
            numeroActe: '15'
