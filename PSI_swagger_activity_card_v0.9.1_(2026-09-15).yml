components:
  schemas:
    FirstNames:
      type: string
      description: Prénom(s) de l'état civil tels que trouvés au RNIPP.
      example: Jean Pierre
    LastName:
      type: string
      description: Nom de famille de l'état civil tel que trouvé au RNIPP
      example: DUPONT
    BirthDate:
      minLength: 1
      type: string
      description: Date de naissance au format ISO-8601
      example: 1995-02-15
    GenderCode:
      type: string
      description: 'Sexe :

        - "M" : Masculin

        - "F" : Féminin

        - "I" : Inconnu

        '
      example: M
      enum:
        - M
        - F
        - I
    BirthLocationCode:
      maxLength: 5
      minLength: 5
      type: string
      description: Code INSEE du lieu de naissance. Correspond au code INSEE de la
        commune de naissance si le pays de naissance est la France ou au code INSEE
        du pays de naissance si la personne est née à l'étranger
      example: '99103'
    BirthPlace:
      minLength: 1
      type: string
      description: Obligatoire uniquement si le code lieu naissance (birthLocationCode)
        est un pays étranger. Correspond au label de la ville étrangère à la France
      example: OSLO
    ProfessionalLastName:
      minLength: 1
      type: string
      description: Nom de famille professionnel
      example: Durant
    Email:
      minLength: 1
      type: string
      description: 'Adresse email de contact :

        - Pour un ES : obligatoire.

        - Pour un RPPS : facultatif.'

      format: email
      example: jean.dupont@gmail.com
    Phone:
      minLength: 1
      type: string

      description: "Numéro de téléphone avec indicatif :

        - Pour un ES : obligatoire.

        - Pour un RPPS : facultatif et l'indicatif est set à +33 par défaut si un numéro est présent mais aucun indicatif."
      pattern: ^\+?[0-9]{4,15}$
      example:
        - '0612345678'
        - '+330612345678'
        - '+33612345678'
    Identifier:
      type: string
      description: 'Identifiant de l''appelant :

        - Pour inscrire un professionnel de santé qui n''a pas la nationalité française : obligatoire  de type RPPS (8), FINESS (3), SIRET (5) ou CAB_RPPS (6) quelque soit l''appelant.

        - Pour un appelant ES : facultatif, de type RPPS (8), FINESS (3), SIRET (5) ou CAB_RPPS (6).

        - Pour un appelant RPPS : obligatoire et de type RPPS (8).

        - Si le bloc cardOrderCps est présent, l''identifiant doit être de type RPPS (8)'

      example: '8100112345678'
    PsiIdentifier:
      type: string
      description: Identifiant PSI du compte déjà créé
      example: 550e8400-e29b-71d4-a716-446655440011
      format: uuid
    StatusPSI:
      type: integer
      description: Status HTTP PSI
      example: 201
      format: int32
    RppsIdentifiers:
      type: array
      description: Liste des identifiants RPPS associés à la personne
      example:
        - '810000000000'
      items:
        type: string
    CardOrderPsiResponse:
      type: object
      properties:
        addressee:
          type: string
          description: Nom du destinataire de la carte
          example: DR DUPONT Jean
        shippingAddress:
          type: string
          description: Adresse de livraison complète sous forme de chaîne de caractères
          example: 10 RUE DE LA PAIX Bâtiment B 75002 PARIS FRANCE
        code:
          $ref: '#/components/schemas/CardCode'
        status:
          $ref: '#/components/schemas/Status'
        message:
          $ref: '#/components/schemas/CardOrderAddressMessage'
    RegisterIdentityRequestDto:
      required:
        - firstNames
        - lastName
        - birthDate
        - birthLocationCode
        - genderCode
      type: object
      properties:
        lastName:
          $ref: '#/components/schemas/LastName'
        firstNames:
          $ref: '#/components/schemas/FirstNames'
        birthDate:
